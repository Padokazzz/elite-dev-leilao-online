services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leilao_online
      POSTGRES_USER: leilao
      POSTGRES_PASSWORD: leilao
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leilao -d leilao_online"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: python manage.py migrate
    environment: &backend-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-compose-dev-secret}
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: leilao_online
      DB_USER: leilao
      DB_PASSWORD: leilao
      REDIS_URL: redis://redis:6379/0
      AUDIT_PSEUDO_SECRET: ${AUDIT_PSEUDO_SECRET:-compose-dev-pseudo}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    environment: *backend-env
    restart: unless-stopped
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: python manage.py settle_auctions_loop --interval 5
    environment: *backend-env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
    environment:
      # O browser fala com a API no host (porta 8000 publicada).
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  front_node_modules:
